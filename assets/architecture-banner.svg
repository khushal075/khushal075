<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Khushal — Enterprise architecture and applied AI</title><desc id="desc">Connecting business goals to architecture decisions and working systems. Animated lines connect goals, decisions, and evidence.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9e4db"/></pattern><style>.label{font-family:Arial,sans-serif;font-size:13px;letter-spacing:3px;fill:#12695e}.title{font-family:Arial,sans-serif;font-weight:700;font-size:56px;letter-spacing:-2px;fill:#233332}.small{font-family:Arial,sans-serif;font-size:18px;fill:#536563}.mono{font-family:monospace;font-size:12px;fill:#12695e}.flow{stroke:#448d77;stroke-width:2;fill:none;stroke-dasharray:5 8;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-52}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs><rect width="1200" height="390" rx="20" fill="#faf8f3"/><rect x="1" y="1" width="1198" height="388" rx="20" fill="url(#grid)" stroke="#d9dfd9"/><text x="52" y="58" class="label">KHUSHAL / ENTERPRISE ARCHITECTURE + APPLIED AI</text><text x="52" y="135" class="title">Architecture that moves</text><text x="52" y="199" class="title" style="fill:#12695e">business forward.</text><text x="54" y="240" class="small">Business goals. Explicit tradeoffs. Working evidence.</text><path d="M217 319H424M591 319H798" class="flow"/><g fill="#fff" stroke="#b3cabc"><rect x="54" y="290" width="164" height="57" rx="9"/><rect x="424" y="290" width="168" height="57" rx="9"/><rect x="798" y="290" width="255" height="57" rx="9"/></g><text x="80" y="324" class="mono">01 / GOALS</text><text x="450" y="324" class="mono">02 / DECISIONS</text><text x="824" y="324" class="mono">03 / WORKING SYSTEMS</text><circle cx="1088" cy="103" r="43" fill="#e6efe6"/><path d="M1069 103h38m-19-19v38" stroke="#12695e" stroke-width="2"/><circle cx="1088" cy="103" r="28" fill="none" stroke="#90b5a2"/></svg>
